services:
  wtc-backend:
    build:
      context: .
      dockerfile: Dockerfile

    pull_policy: build
    restart: unless-stopped

    ports:
      - "${BACKEND_PORT:-30001}:8000"

    environment:
      # ── Application ───────────────────────────────────────────────
      APP_NAME: "${APP_NAME:-LMS}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-https://wtc-api.pinat.nl}"

      APP_LOCALE: "${APP_LOCALE:-en}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-en}"
      APP_FAKER_LOCALE: "${APP_FAKER_LOCALE:-en_US}"
      APP_MAINTENANCE_DRIVER: "${APP_MAINTENANCE_DRIVER:-file}"

      BCRYPT_ROUNDS: "${BCRYPT_ROUNDS:-12}"

      # ── Logging ───────────────────────────────────────────────────
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_STACK: "${LOG_STACK:-single}"
      LOG_DEPRECATIONS_CHANNEL: "${LOG_DEPRECATIONS_CHANNEL:-null}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"

      # ── Database / PostgreSQL ─────────────────────────────────────
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-192.168.1.20}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      # ── Session ───────────────────────────────────────────────────
      SESSION_DRIVER: "${SESSION_DRIVER:-redis}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      SESSION_ENCRYPT: "${SESSION_ENCRYPT:-false}"
      SESSION_PATH: "${SESSION_PATH:-/}"
      SESSION_DOMAIN: "${SESSION_DOMAIN:-null}"

      # ── Cache / Queue ─────────────────────────────────────────────
      CACHE_STORE: "${CACHE_STORE:-redis}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"

      BROADCAST_CONNECTION: "${BROADCAST_CONNECTION:-log}"

      # ── Redis ─────────────────────────────────────────────────────
      REDIS_CLIENT: "${REDIS_CLIENT:-phpredis}"
      REDIS_HOST: "${REDIS_HOST:-192.168.1.20}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_PORT: "${REDIS_PORT:-6379}"

      # ── Memcached ─────────────────────────────────────────────────
      MEMCACHED_HOST: "${MEMCACHED_HOST:-127.0.0.1}"

      # ── Filesystem / S3 ───────────────────────────────────────────
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-s3}"

      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      AWS_BUCKET: "${AWS_BUCKET}"
      AWS_ENDPOINT: "${AWS_ENDPOINT:-https://s3.pinat.nl}"
      AWS_USE_PATH_STYLE_ENDPOINT: "${AWS_USE_PATH_STYLE_ENDPOINT:-true}"

      # ── Mail ──────────────────────────────────────────────────────
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_SCHEME: "${MAIL_SCHEME:-null}"
      MAIL_HOST: "${MAIL_HOST:-127.0.0.1}"
      MAIL_PORT: "${MAIL_PORT:-2525}"
      MAIL_USERNAME: "${MAIL_USERNAME:-null}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-null}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@example.com}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-LMS}"

      # ── PinatAuth / JWT / JWKS ────────────────────────────────────
      PINAT_AUTHURL: "${PINAT_AUTHURL:-https://auth.pinat.nl}"

      # ── Pinat AI ──────────────────────────────────────────────────
      PINAT_AI_API_KEY: "${PINAT_AI_API_KEY}"
      PINAT_AI_BASE_URL: "${PINAT_AI_BASE_URL:-https://ai.pinat.nl/v1}"
      PINAT_AI_MODEL: "${PINAT_AI_MODEL:-kr/deepseek-3.2}"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s